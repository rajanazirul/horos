[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
# Pinned per the architecture spine (Stack table). Arc testnet is an Osaka EVM
# baseline; evm_version is explicit so Circle Contracts deploys get the same bytecode.
solc_version = "0.8.37"
evm_version = "osaka"
optimizer = true
optimizer_runs = 200
auto_detect_solc = false
# Story 1.3: the vector generator writes the TypeScript-port fixtures here, and nowhere else.
# Story 1.7: the deploy test reads the Demo-wallet fixture to pin its codehash to the build.
fs_permissions = [
  { access = "read-write", path = "./test-vectors" },
  { access = "read", path = "../fixtures" },
]
remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "forge-std/=lib/forge-std/src/",
]

# Story 1.7: `--rpc-url arc_testnet`. Blockscout verification needs no API key.
[rpc_endpoints]
arc_testnet = "https://rpc.testnet.arc.io"

[fuzz]
runs = 256

[invariant]
runs = 256
depth = 50
fail_on_revert = false
